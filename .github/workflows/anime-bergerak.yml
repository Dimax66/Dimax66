name: anime bergerak

on:
  schedule:
    - cron: "0 0 * * *"   # jalan tiap hari (00:00 UTC)
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Dimax66
          outputs: |
            dist/anime-bergerak.svg?palette=github-dark
            dist/anime-bergerak-dark.svg?palette=github-dark
            dist/anime-bergerak-light.svg?palette=github-light

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
